# 预发环境：真实传感器 + 独立进程 + 告警开启
amr:
  environment: staging
  log_level: info
  sensors:
    lidar:
      type: sick_tim781
      topic: /scan
  perf:
    instrumentation: false
  alerts:
    # 四审 N(⑥⑧) 裁决：规则入库但通道未接线，enabled 如实为 false（详见 production.yaml 注）
    enabled: false
    prometheus_rules: /etc/amr/prometheus/amr_alerts.yml
