# AMCL 定位参数 — 对齐 Gazebo DiffDrive frame（amr/odom, amr/chassis, map）
amcl:
  ros__parameters:
    use_sim_time: true
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: amr/chassis
    global_frame_id: map
    odom_frame_id: amr/odom
    scan_topic: /scan
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    laser_model_type: likelihood_field
    laser_max_range: 20.0
    laser_min_range: 0.1
    sigma_hit: 0.2
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    tf_broadcast: true
    # 用参数初始位姿（自动定位，无需手动 /initialpose）
    set_initial_pose: true
    # 车 spawn 在 world (0,0)，map 坐标系 = (0 - origin) = (8.162, 9.852)
    initial_pose:
      x: 8.162
      y: 9.852
      yaw: 0.0
