name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'doc/**'
      - 'mdDoc/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**.md'
      - 'doc/**'
      - 'mdDoc/**'
  workflow_dispatch: {}   # 手动触发（push 事件偶发丢失时的兜底，2026-08-25 实证需要）
  schedule:
    - cron: '0 18 * * *'   # TSAN nightly（UTC 18:00 = 北京 02:00，三审⑤）

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # P0 防再犯（2026-08-25 私钥泄露事故，见 doc/ITERATION.md 外部审计 §2）：
  # 全历史密钥扫描先于一切构建——含私钥的提交在这里被挡下
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 扫全部历史，不只 HEAD
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Wave 2.1（三审 2026-08-31）：ASAN+UBSAN 防线——cppcheck 对跨函数指针
  # 逃逸类 UAF 天生盲区（实证），该类 UB 的有效检测器是 sanitizer。
  # run_tests.sh asan 模式已内置编译并行限幅（WSL OOM 事故教训）。
  asan-gate:
    runs-on: ubuntu-latest
    container: ros:jazzy-ros-base
    steps:
      - name: Install system deps
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            build-essential ros-jazzy-rclcpp ros-jazzy-rclcpp-action \
            ros-jazzy-rclcpp-lifecycle ros-jazzy-rclcpp-components \
            ros-jazzy-lifecycle-msgs ros-jazzy-sensor-msgs \
            ros-jazzy-geometry-msgs ros-jazzy-std-msgs ros-jazzy-action-msgs \
            ros-jazzy-ament-cmake-gtest ros-jazzy-rosidl-default-generators \
            ros-jazzy-diagnostic-msgs ros-jazzy-hardware-interface \
            ros-jazzy-pluginlib \
            python3-colcon-common-extensions \
            && rm -rf /var/lib/apt/lists/*
      - uses: actions/checkout@v4
        with:
          path: src/ros2_robot_middleware
      - name: Build + Test (ASan + UBSan)
        shell: bash
        run: |
          . /opt/ros/jazzy/setup.sh
          cd src/ros2_robot_middleware
          ./quality/scripts/run_tests.sh asan

  build-test-coverage:
    runs-on: ubuntu-24.04
    # badge 自动提交需要写权限（仅 GITHUB_TOKEN 范围内，无第三方凭证）
    permissions:
      contents: write
    container: ros:jazzy-ros-base
    strategy:
      fail-fast: false
      matrix:
        rmw: [fastrtps, cyclonedds]   # 防腐层持续验证: 同一份代码双 DDS 实现跑 CI
    env:
      RMW_IMPL: ${{ matrix.rmw == 'cyclonedds' && 'rmw_cyclonedds_cpp' || 'rmw_fastrtps_cpp' }}

    steps:
      - name: Install system deps
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            build-essential \
            ros-jazzy-rclcpp \
            ros-jazzy-rclcpp-action \
            ros-jazzy-rclcpp-lifecycle \
            ros-jazzy-rclcpp-components \
            ros-jazzy-lifecycle-msgs \
            ros-jazzy-sensor-msgs \
            ros-jazzy-geometry-msgs \
            ros-jazzy-std-msgs \
            ros-jazzy-action-msgs \
            ros-jazzy-ament-cmake-gtest \
            ros-jazzy-rosidl-default-generators \
            ros-jazzy-diagnostic-msgs \
            ros-jazzy-hardware-interface \
            ros-jazzy-pluginlib \
            ros-jazzy-rmw-cyclonedds-cpp \
            python3-colcon-common-extensions \
            cppcheck lcov \
            && rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@v4
        with:
          path: src/ros2_robot_middleware

      - name: Static Analysis
        shell: bash
        run: |
          . /opt/ros/jazzy/setup.sh
          cd src/ros2_robot_middleware
          ./quality/scripts/static_analysis.sh

      - name: Build + Test + Coverage (${{ matrix.rmw }})
        shell: bash
        run: |
          . /opt/ros/jazzy/setup.sh
          export RMW_IMPLEMENTATION=$RMW_IMPL
          cd src/ros2_robot_middleware
          ./quality/quality.sh

      # B4 可复算度量链：.info 原始件归档（任何人可用 coverage_report.py 复算徽章数字）
      - name: Archive coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.rmw }}
          path: |
            /tmp/amr_cov_filtered.info
            src/ros2_robot_middleware/quality/data/
          retention-days: 90

      - name: Coverage summary
        shell: bash
        run: |
          echo "## Coverage (${{ matrix.rmw }})" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat src/ros2_robot_middleware/quality/data/coverage_full.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # badge 由 CI 实测更新（仅 fastrtps 腿执行，避免矩阵双写冲突）——
      # README 徽章走 endpoint URL，数字与归档 .info 恒一致
      - name: Update coverage badge
        if: matrix.rmw == 'fastrtps'
        shell: bash
        run: |
          cd src/ros2_robot_middleware
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add quality/data/badge.json quality/data/coverage.txt \
                  quality/data/coverage.prev.txt quality/data/coverage_full.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore(coverage): CI 实测徽章更新 [skip ci]"
            # P0-J（三审）：徽章 push 失败曾静默 4 天无人发现——现在失败置红，
            # 并带一次 rebase 重试（多腿并发时的 non-fast-forward 场景）
            git push || (git pull --rebase && git push) || \
              (echo "::error::badge push 失败——徽章新鲜度断裂（P0-J）" && exit 1)
          else
            echo "badge 数据无变化（覆盖率未变）——新鲜度正常"
          fi

  # ── 三审①/四审：tag 守卫——tag 必须 main 可达 + 三宇宙对齐 ──────────
  # v2.2.0 曾打在 history-rewrite 后的死 commit 上（merge-base 失败），
  # v2.3.0 同病（四审亲验）。守卫让"tag 打在不可达提交"从此 CI 红。
  tag-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # merge-base 判可达需要全历史
      - name: Verify tags reachable & version-universe aligned
        shell: bash
        run: |
          set -e
          FAIL=0
          for tag in $(git tag -l 'v*'); do
            if git merge-base --is-ancestor "$(git rev-parse "$tag")" HEAD; then
              echo "✓ $tag 可达"
            else
              echo "::error::$tag 不在 HEAD 祖先链上（history rewrite 死提交）——需重打（见 journal 治理动作留痕）"
              FAIL=1
            fi
          done
          # 三宇宙对齐：package.xml == CHANGELOG 最新节 == 最新 tag
          VER=$(grep -m1 -oP '(?<=<version>)[^<]+' package.xml)
          LATEST=$(git tag -l 'v*' --sort=-v:refname | head -1)
          grep -q "\[$VER\]" CHANGELOG.md || { echo "::error::CHANGELOG 缺 [$VER] 节"; FAIL=1; }
          [ "v$VER" = "$LATEST" ] || { echo "::error::package.xml=$VER 但最新 tag=$LATEST"; FAIL=1; }
          exit $FAIL

  # ── 三审⑤/四审：TSAN nightly——P0-B 类竞态的自动防线 ────────────────
  # 全量测试对 TSAN 噪声大（DDS 内部数据竞争已知），只跑并发核心：
  # decision 并发压力（P0-B 回归锁）+ collision_guard + scene。
  tsan-nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ROS Jazzy
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq curl gnupg
          sudo curl -sSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key \
            -o /usr/share/keyrings/ros-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] http://packages.ros.org/ros2/ubuntu noble main" \
            | sudo tee /etc/apt/sources.list.d/ros2.list
          sudo apt-get update -qq && sudo apt-get install -y -qq ros-jazzy-ros-base \
            python3-colcon-common-versions python3-colcon-common-extensions
      - name: Build + run concurrency-core tests (TSan)
        shell: bash
        run: |
          . /opt/ros/jazzy/setup.sh
          mkdir -p tsan_ws/src && ln -s "$GITHUB_WORKSPACE" tsan_ws/src/ros2_robot_middleware
          cd tsan_ws
          colcon build --packages-select ros2_robot_middleware --cmake-args \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -g -O1" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread" -DBUILD_TESTING=ON
          . install/setup.bash
          TSAN_OPTIONS="halt_on_error=1 second_deadlock_stack=1" \
            ./build/ros2_robot_middleware/test_decision 2>&1 | tee /tmp/tsan.log
          grep -q "ThreadSanitizer" /tmp/tsan.log && { echo "::error::TSAN 报告自家数据竞争"; exit 1; } || true
          echo "TSAN 并发核心零报告"

  # ── M1（商用差距 20260908）：NAV2 冒烟——绕闸类缺陷的永久 CI 锁 ──────
  # N-2（launch 直出 /cmd_vel 绕闸）只有人工审计能抓；本 job 让它变红灯：
  # 启动 nav2_scene，断言 guard 在 + /cmd_vel_raw 流量 + /cmd_vel 流量 +
  # 目标到达。60-90s 预算（含 launch bringup ~40s）。
  nav2-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install ROS Jazzy + NAV2 stack
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq curl gnupg
          sudo curl -sSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key \
            -o /usr/share/keyrings/ros-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] http://packages.ros.org/ros2/ubuntu noble main" \
            | sudo tee /etc/apt/sources.list.d/ros2.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq ros-jazzy-ros-base \
            ros-jazzy-nav2-bringup ros-jazzy-slam-toolbox \
            ros-jazzy-foxglove-bridge ros-jazzy-robot-state-publisher \
            python3-colcon-common-extensions
      - name: Build package
        run: |
          . /opt/ros/jazzy/setup.sh
          mkdir -p ws/src && ln -s "$GITHUB_WORKSPACE" ws/src/ros2_robot_middleware
          cd ws && colcon build --packages-select ros2_robot_middleware
      - name: NAV2 smoke (guard wired + link flow + goal reach)
        shell: bash
        run: |
          . /opt/ros/jazzy/setup.sh
          cd ws && source install/setup.bash
          timeout 240 bash src/ros2_robot_middleware/quality/scripts/nav2_smoke.sh

  # ── F2 验证门：受监管 NAV2 形态——「节点挂死不可见」的永久 CI 锁 ──────
  # 故障形状：kill -STOP（进程活着、不工作）。NAV2 的 bond 4s 能检出但恢复
  # 不了（进程没死，launch respawn 与 waitpid 都看不见）——本 job 断言
  # health_monitor 报 ERROR → supervisor 进程组 kill+重拉 → 整栈复活 → 可驱车。
  # 实测 78s（含空闲 30s 误杀观察窗）；CI 慢机留 300s 上限。
  nav2-supervised-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install ROS Jazzy + NAV2 stack
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq curl gnupg
          sudo curl -sSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key \
            -o /usr/share/keyrings/ros-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] http://packages.ros.org/ros2/ubuntu noble main" \
            | sudo tee /etc/apt/sources.list.d/ros2.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq ros-jazzy-ros-base \
            ros-jazzy-nav2-bringup ros-jazzy-slam-toolbox \
            ros-jazzy-foxglove-bridge ros-jazzy-robot-state-publisher \
            python3-colcon-common-extensions
      - name: Build package
        run: |
          . /opt/ros/jazzy/setup.sh
          mkdir -p ws/src && ln -s "$GITHUB_WORKSPACE" ws/src/ros2_robot_middleware
          cd ws && colcon build --packages-select ros2_robot_middleware
      - name: Supervised NAV2 smoke (hang detected + process-level recovery)
        shell: bash
        run: |
          . /opt/ros/jazzy/setup.sh
          cd ws && source install/setup.bash
          timeout 300 bash src/ros2_robot_middleware/quality/scripts/nav2_supervised_smoke.sh
