version: "3.10"

# ── Shared configuration ──────────────────────────────────────────────
x-node: &node
  build:
    context: ..
    dockerfile: toolkit/Dockerfile
    target: runtime
  network_mode: host
  ipc: host
  environment:
    - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
  mem_limit: 256m
  cpus: 0.5
  stop_grace_period: 5s

# ── Services — one container per node ─────────────────────────────────
services:

  lidar:
    <<: *node
    container_name: middleware_lidar
    command: [lidar]
    healthcheck:
      test: ["CMD", "/health-check.sh", "lidar"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  imu:
    <<: *node
    container_name: middleware_imu
    command: [imu]
    healthcheck:
      test: ["CMD", "/health-check.sh", "imu"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  camera:
    <<: *node
    container_name: middleware_camera
    command: [camera]
    healthcheck:
      test: ["CMD", "/health-check.sh", "camera"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 交付物事实（R5.1，三审）：fusion/decision/motor_ctrl 无独立可执行——
  # 三节点共享 compute_container 单进程（零拷贝）。此前三个独立服务 =
  # 三份全管线 = 话题冲突，必挂。
  compute:
    <<: *node
    container_name: middleware_compute
    command: [compute_container]
    depends_on:
      lidar:
        condition: service_healthy
      imu:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/health-check.sh", "fusion"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  health_monitor:
    <<: *node
    container_name: middleware_health_monitor
    command: [health_monitor]
    depends_on:
      compute:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/health-check.sh", "health_monitor"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 128m
